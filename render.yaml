services:
  - type: web
    name: todo-backend
    env: node
    region: frankfurt
    plan: free
    buildCommand: npm install && npx nx build todo-be --configuration=production
    startCommand: node dist/apps/todo-be/main.js
    healthCheckPath: /api/health/ready
    envVars:
      - key: EMAIL_PROVIDER
        value: resend
      - key: MONGODB_URI
        sync: false
      - key: DATABASE_NAME
        sync: false
      - key: PORT
        value: 3333
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        sync: false
