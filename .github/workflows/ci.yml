name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - run: npm ci

      - run: npm exec nx -- run-many --target=lint

  typescript:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - run: npm ci

      - run: npm run typecheck

  deprecated-tokens:
    name: Deprecated theme tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - run: npm ci

      - run: npm run check:deprecated-tokens

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - run: npm ci

      - name: Unit tests
        run: npm exec nx -- run-many --target=test --configuration=ci --coverage

      - name: Build
        run: npm exec nx -- run-many --target=build

  e2e:
    name: E2E smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # MongoDB as a service container is up before any step below runs.
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      NODE_ENV: development
      PORT: 3333
      MONGODB_URI: mongodb://localhost:27017/todo
      NX_API_URL: http://localhost:3333/api
      CORS_ORIGIN: http://localhost:4200
      FIREBASE_PROJECT_ID: todo-app-97286
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      # Placeholder web-app config — the JS SDK never talks to real Firebase
      # here, every auth/storage call is redirected to the emulators below.
      NX_FIREBASE_PROJECT_ID: todo-app-97286
      NX_FIREBASE_API_KEY: fake-api-key
      NX_FIREBASE_AUTH_DOMAIN: todo-app-97286.firebaseapp.com
      NX_FIREBASE_STORAGE_BUCKET: todo-app-97286.firebasestorage.app
      NX_FIREBASE_MESSAGING_SENDER_ID: '0'
      NX_FIREBASE_APP_ID: '1:0:web:0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - run: npm ci

      # firebase-tools' emulators require Java 21+ to run — the runner's
      # default JDK is older, confirmed live via
      # "Error: firebase-tools no longer supports Java version before 21."
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - run: npm install -g firebase-tools

      # Each service below is started detached (nohup + &) so it survives
      # past its own step, then the next step blocks until that service
      # actually answers before starting the next one — Cypress never runs
      # until the whole chain (Mongo → emulators → backend → frontend) is
      # confirmed up, not just "started".
      - name: Start Firebase Auth/Storage emulators
        run: nohup firebase emulators:start --only auth,storage --project todo-app-97286 > firebase-emulator.log 2>&1 &

      - name: Wait for Firebase Auth emulator
        run: until curl -sf http://127.0.0.1:9099; do sleep 1; done
        timeout-minutes: 2

      - name: Start backend
        run: nohup npx nx serve todo-be > backend.log 2>&1 &

      - name: Wait for backend
        run: until curl -sf http://localhost:3333/api/health/ready; do sleep 1; done
        timeout-minutes: 3

      - name: Start frontend
        run: nohup npx nx serve todo > frontend.log 2>&1 &

      - name: Wait for frontend
        run: until curl -sf http://localhost:4200; do sleep 1; done
        timeout-minutes: 3

      - name: Authenticated Cypress smoke flow
        run: npx nx e2e-ci todo-e2e

      - name: Upload service logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-service-logs
          path: |
            firebase-emulator.log
            backend.log
            frontend.log
