name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - run: npm ci

      - run: npm exec nx -- run-many --target=lint

  typescript:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - run: npm ci

      - run: npm run typecheck

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - run: npm ci

      - name: Unit tests
        run: npm exec nx -- run-many --target=test --configuration=ci

      - name: Build
        run: npm exec nx -- run-many --target=build

  e2e:
    name: Authenticated smoke test
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: password
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGODB_URI: mongodb://root:password@127.0.0.1:27017/?authSource=admin
      DATABASE_NAME: todo-e2e
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      FIREBASE_PROJECT_ID: demo-todo
      NX_API_URL: http://localhost:3333/api
      NX_FIREBASE_API_KEY: demo-api-key
      NX_FIREBASE_AUTH_DOMAIN: demo-todo.firebaseapp.com
      NX_FIREBASE_PROJECT_ID: demo-todo
      NX_FIREBASE_STORAGE_BUCKET: demo-todo.appspot.com
      NX_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
      NX_FIREBASE_APP_ID: 1:000000000000:web:0000000000000000000000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - run: npm ci

      - name: Start Firebase emulators
        run: >-
          npm exec --yes --package=firebase-tools@15.14.0 --
          firebase emulators:start --only auth,storage --project demo-todo &

      - name: Start backend
        run: npm exec nx -- run todo-be:serve &

      - name: Wait for local services
        run: |
          for url in http://127.0.0.1:9099 http://127.0.0.1:3333/api-docs; do
            for attempt in {1..60}; do
              curl --fail --silent "$url" >/dev/null && break
              if [ "$attempt" -eq 60 ]; then
                echo "Timed out waiting for $url"
                exit 1
              fi
              sleep 2
            done
          done

      - name: Run authenticated Cypress smoke flow
        run: npm run test:e2e
