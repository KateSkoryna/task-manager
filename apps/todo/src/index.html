<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Task Manager</title>
    <base href="/" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <script>
      // Applies the saved theme before first paint to avoid a flash of the
      // wrong theme. Without a saved choice it follows the device's setting.
      // The storage key must match STORAGE_KEY in useTheme.ts.
      (function () {
        var saved = localStorage.getItem('todo-theme');
        var prefersDark =
          window.matchMedia &&
          window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme =
          saved === 'dark' || saved === 'light'
            ? saved
            : prefersDark
            ? 'dark'
            : 'light';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body class="font-sans bg-app text-primary">
    <div id="root"></div>
  </body>
</html>
