<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Task Manager</title>
    <base href="/" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <script>
      // Applies the saved theme before first paint to avoid a flash of the
      // wrong theme. The storage key must match STORAGE_KEY in useTheme.ts.
      (function () {
        var saved = localStorage.getItem('todo-theme');
        var theme = saved === 'dark' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body class="font-sans bg-app text-primary">
    <div id="root"></div>
  </body>
</html>
